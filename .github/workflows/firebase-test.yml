# TEST environment: merging into master publishes the app and the Firestore
# security rules to the TEST project (https://zn-crew-control-system-test.web.app).
# The live project is only updated by the manual "Go live" workflow.
# Secret: FIREBASE_SERVICE_ACCOUNT = a key of the TEST project.
name: Deploy test

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-test
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Deploy Firestore rules
        run: npx --yes firebase-tools@latest deploy --only firestore:rules --project zn-crew-control-system-test --non-interactive

      - name: Deploy website (test project)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: zn-crew-control-system-test
          channelId: live  # = the test project's main site
