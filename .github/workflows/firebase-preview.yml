# Staging: every pull request gets its own temporary Firebase Hosting URL
# (a "preview channel"), posted as a comment on the PR. Free on the Spark plan.
# The live site is NOT touched.
#
# One-time setup: add the repo secret FIREBASE_SERVICE_ACCOUNT
# (see docs/FREE_TIER.md → "Hosting online before going live").
name: Deploy preview (staging)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  preview:
    # Secrets are not available to PRs from forks.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # Firestore security rules. The preview and live site share one
      # database, so the app can't read or write anything until these exist.
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Deploy Firestore rules
        run: npx --yes firebase-tools@latest deploy --only firestore:rules --project zn-crew-contol-system --non-interactive

      - name: Deploy to preview channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: zn-crew-contol-system
          channelId: staging
          expires: 30d
